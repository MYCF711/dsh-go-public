name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - name: Set timezone
        shell: cmd
        run: tzutil /s "China Standard Time"

      - name: Build
        shell: bash
        run: go build ./...
      - name: Vet
        shell: bash
        run: go vet ./...
      - name: Test
        shell: bash
        run: go test ./... -timeout 20m
